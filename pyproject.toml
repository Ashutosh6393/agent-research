[project]
name = "agent-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "python-dotenv>=1.2.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.18",
    "langgraph-cli[inmem]>=0.4.40",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
]


[tool.pyrefly]
python-version = "3.13"
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.13"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
pythonVersion = "3.13"

